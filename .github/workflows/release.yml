name: Release

on:
  push:
    tags:
      - 'v*'
  # 手动触发即干跑：完整编译打包，产物只留在 workflow 里，不建 GitHub Release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  APP_ASSET_PREFIX: DanmakuCut

jobs:
  # 推 tag 时校验 tag 与 package.json 版本一致（tauri.conf.json 的 version 直接读取 package.json）
  version-check:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compare tag with package.json version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pkg_version=$(node -p "require('./package.json').version")
          cargo_version=$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' src-tauri/Cargo.toml | head -1)
          if [ "${TAG#v}" != "$pkg_version" ] || [ "$pkg_version" != "$cargo_version" ]; then
            echo "::error::Tag $TAG, package.json ($pkg_version) and src-tauri/Cargo.toml ($cargo_version) versions must match"
            exit 1
          fi

  release:
    name: Build ${{ matrix.platform }}
    needs: version-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x86_64
          - os: windows-11-arm
            platform: Windows-arm64
            target: aarch64-pc-windows-msvc
          - os: ubuntu-22.04
            platform: Linux-x86_64
          - os: ubuntu-22.04-arm
            platform: Linux-arm64
          - os: macos-latest
            platform: macOS
            target: universal-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      # rust-toolchain.toml 是编译器版本的唯一来源
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file patchelf libssl-dev rpm xdg-utils \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # macOS 签名与公证为可选项：仓库配置了对应 secrets 时 Tauri CLI 会自动签名、公证
      - name: Prepare macOS signing env
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            echo "macOS code signing enabled"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              {
                echo "APPLE_ID=$APPLE_ID"
                echo "APPLE_PASSWORD=$APPLE_PASSWORD"
                echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              } >> "$GITHUB_ENV"
              echo "macOS notarization enabled"
            fi
          else
            echo "::warning::Apple signing secrets not configured, building unsigned macOS app"
          fi

      - name: Build Tauri App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ matrix.target }}') {
            pnpm tauri build --target ${{ matrix.target }} --bundles msi,nsis
          } else {
            pnpm tauri build --bundles msi,nsis
          }

      - name: Build Tauri App (Linux)
        if: runner.os == 'Linux'
        env:
          LINUXDEPLOY_EXCLUDED_LIBRARIES: "libwayland-client.so*"
          # linuxdeploy 依赖 FUSE，GitHub runner 上改为解包运行
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm tauri build --bundles appimage,deb,rpm

      - name: Build Tauri App (macOS)
        if: runner.os == 'macOS'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app,dmg

      - name: Prepare Windows Assets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          # 手动干跑时是分支名，斜杠会被当成目录，换成 -
          $version = $env:GITHUB_REF_NAME -replace '/', '-'
          $targetRoot = if ($env:TARGET) { "src-tauri/target/$env:TARGET/release" } else { 'src-tauri/target/release' }
          $prefix = "$env:APP_ASSET_PREFIX-$version-$env:PLATFORM"

          $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/msi') -Filter *.msi | Select-Object -First 1
          if ($null -eq $msi) { throw "No MSI installer found" }
          Copy-Item $msi.FullName "release-assets/$prefix.msi"

          $nsis = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/nsis') -Filter *.exe | Select-Object -First 1
          if ($null -eq $nsis) { throw "No NSIS installer found" }
          Copy-Item $nsis.FullName "release-assets/$prefix-Setup.exe"

          # 绿色版（portable）：仅可执行文件打 zip
          $exePath = Join-Path $targetRoot 'bas-creater.exe'
          if (-not (Test-Path $exePath)) { throw "Portable exe not found: $exePath" }
          $portableDir = 'release-assets/portable'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item $exePath (Join-Path $portableDir "$env:APP_ASSET_PREFIX.exe")
          Compress-Archive -Path "$portableDir/*" -DestinationPath "release-assets/$prefix-Portable.zip" -Force
          Remove-Item -Recurse -Force $portableDir

      - name: Prepare Linux Assets
        if: runner.os == 'Linux'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME//\//-}"
          PREFIX="${APP_ASSET_PREFIX}-${VERSION}-${PLATFORM}"
          for ext in AppImage deb rpm; do
            file=$(find src-tauri/target/release/bundle -name "*.${ext}" | head -1 || true)
            if [ -z "$file" ]; then
              echo "❌ No .${ext} found under target/release/bundle" >&2
              exit 1
            fi
            cp "$file" "release-assets/${PREFIX}.${ext}"
          done

      - name: Prepare macOS Assets
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME//\//-}"
          PREFIX="${APP_ASSET_PREFIX}-${VERSION}-macOS"
          BUNDLE_DIR="src-tauri/target/${TARGET}/release/bundle"
          DMG=$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name "*.dmg" | head -1 || true)
          APP=$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name "*.app" -type d | head -1 || true)
          if [ -z "$DMG" ] || [ -z "$APP" ]; then
            echo "❌ macOS bundle not found" >&2
            exit 1
          fi
          cp "$DMG" "release-assets/${PREFIX}.dmg"
          # .app 压缩包（解压即用），使用 ditto 保留扩展属性与签名
          ditto -c -k --sequesterRsrc --keepParent "$APP" "release-assets/${PREFIX}.zip"

      - name: List prepared assets
        shell: bash
        run: ls -la release-assets

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: release
    # 只有推 tag 才发布，手动触发仅为干跑
    if: github.event_name == 'push' && github.ref_type == 'tag'
    steps:
      - name: Download built release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: List downloaded release artifacts
        run: ls -la release-assets

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: DanmakuCut ${{ github.ref_name }}
          draft: true
          body: |
            ## DanmakuCut ${{ github.ref_name }}

            BAS 弹幕时间轴编辑器桌面客户端

            ### 下载

            - **Windows (x86_64)**: `DanmakuCut-${{ github.ref_name }}-Windows-x86_64-Setup.exe` / `.msi`（安装版）或 `-Portable.zip`（绿色版）
            - **Windows (ARM64)**: `DanmakuCut-${{ github.ref_name }}-Windows-arm64-Setup.exe` / `.msi` 或 `-Portable.zip`
            - **macOS (Universal)**: `DanmakuCut-${{ github.ref_name }}-macOS.dmg`（推荐）或 `.zip`（解压即用）
            - **Linux (x86_64)**: `DanmakuCut-${{ github.ref_name }}-Linux-x86_64.AppImage` / `.deb` / `.rpm`
            - **Linux (ARM64)**: `DanmakuCut-${{ github.ref_name }}-Linux-arm64.AppImage` / `.deb` / `.rpm`

            > 未配置 Apple 签名证书时，macOS 版本为未签名应用，首次打开需在「系统设置 → 隐私与安全性」中允许。
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
