[package]
name = "bas-creater"
version = "0.1.0"
description = "DanmakuCut - BAS danmaku timeline editor"
authors = ["Kvxin"]
repository = "https://github.com/Kvxin/bas-creater"
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "bas_creater_lib"
# 只发布桌面版，不需要 Tauri 移动端使用的 staticlib / cdylib
crate-type = ["rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = "symbols"
